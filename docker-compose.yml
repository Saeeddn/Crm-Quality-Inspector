# docker-compose.yml — production deployment on Ollama server
# Connects to the NATIVE PostgreSQL on the host (not a container).
# Logs persist on a host volume at /var/log/crm-qi/.
#
# Usage:
#   cp .env .env  (edit DATABASE_URL and ADMIN_PASSWORD)
#   docker compose up -d --build
#   open http://<server-ip>:3000

services:
  app:
    build: .
    image: crm-quality-inspector:latest
    restart: unless-stopped
    # Use host network so the container can reach native PostgreSQL on 127.0.0.1
    network_mode: host
    environment:
      # Connect to the NATIVE postgres on the host, NOT a container
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RUST_LOG: info,crm_qi=info,sqlx=warn
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      LOG_FILE: /var/log/crm-qi/crm-quality-inspector.log
    volumes:
      # Bind mount for log persistence — survives container rebuilds
      - /root/crm-qi-logs:/var/log/crm-qi
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
