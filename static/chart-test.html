<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Chart Test</title>
<style>
body { background: #1a1d27; color: #e6e8ee; font-family: Tahoma; padding: 20px; }
canvas { background: #2a2f3d; border-radius: 8px; }
#status { margin-top: 10px; padding: 10px; border-radius: 4px; }
.ok { background: #22c55e20; color: #22c55e; }
.err { background: #ef444420; color: #ef4444; }
</style>
</head>
<body>
<h2>Chart.js Test</h2>
<div id="status">در حال بارگذاری...</div>
<canvas id="trendChart" width="400" height="200"></canvas>
<canvas id="scoreChart" width="400" height="200"></canvas>
<canvas id="agentChart" width="400" height="200"></canvas>
<script src="/static/jquery.min.js"></script>
<script src="/static/chart.umd.min.js"></script>
<script>
async function test() {
  const status = document.getElementById('status');
  try {
    // Login
    const loginRes = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: 'admin', password: 'ADMIN_PASS_REDACTED'})
    });
    const loginData = await loginRes.json();
    const token = loginData.data.token;
    
    // Fetch scores
    const scoresRes = await fetch('/api/scoring/1012', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    const scoresData = await scoresRes.json();
    
    // Fetch dashboard
    const dashRes = await fetch('/api/reports/dashboard', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    const dashData = await dashRes.json();
    
    // Fetch interactions
    const intRes = await fetch('/api/interactions', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    const intData = await intRes.json();
    
    // Fetch agents
    const agentRes = await fetch('/api/agents', {
      headers: {'Authorization': 'Bearer ' + token}
    });
    const agentData = await agentRes.json();
    
    status.className = 'ok';
    status.textContent = '✅ API OK - ' + scoresData.success + ' scores:' + agentData.data.length;
    
    // Test Chart
    if (typeof Chart === 'undefined') {
      status.className = 'err';
      status.textContent = '❌ Chart.js not loaded!';
      return;
    }
    if (typeof $ === 'undefined') {
      status.className = 'err';
      status.textContent = '❌ jQuery not loaded!';
      return;
    }
    
    // Test trend chart
    const scores = [
      {created_at: '2026-09-01T10:00:00Z', overall_score: 64.7},
      {created_at: '2026-09-01T11:00:00Z', overall_score: 52.3},
      {created_at: '2026-09-01T12:00:00Z', overall_score: 57.2},
      {created_at: '2026-09-01T13:00:00Z', overall_score: 49.4},
      {created_at: '2026-09-01T14:00:00Z', overall_score: 61.9},
      {created_at: '2026-09-01T15:00:00Z', overall_score: 62.9},
      {created_at: '2026-09-01T16:00:00Z', overall_score: 49},
      {created_at: '2026-09-01T17:00:00Z', overall_score: 55}
    ];
    
    const ctx = document.getElementById('trendChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: scores.map(s => s.created_at.slice(0,10)),
        datasets: [{
          label: 'امتیاز',
          data: scores.map(s => s.overall_score),
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99,102,241,0.15)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#e6e8ee' } } },
        scales: {
          x: { ticks: { color: '#8a92a6' }, grid: { color: '#3a3f4d' } },
          y: { min: 0, max: 100, ticks: { color: '#8a92a6' }, grid: { color: '#3a3f4d' } }
        }
      }
    });
    
    // Score chart
    const healthy = scores.filter(s => s.overall_score >= 80).length;
    const improvement = scores.filter(s => s.overall_score >= 60 && s.overall_score < 80).length;
    const critical = scores.filter(s => s.overall_score < 60).length;
    
    new Chart(document.getElementById('scoreChart'), {
      type: 'doughnut',
      data: {
        labels: ['سالم (≥80)', 'نیازمند بهبود (60-80)', 'بحرانی (<60)'],
        datasets: [{
          data: [healthy, improvement, critical],
          backgroundColor: ['#22c55e', '#f59e0b', '#ef4444'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { position: 'bottom', labels: { color: '#e6e8ee' } } }
      }
    });
    
    // Agent chart
    const agents = agentData.data.filter(a => a.active);
    new Chart(document.getElementById('agentChart'), {
      type: 'bar',
      data: {
        labels: agents.map(a => a.name),
        datasets: [{
          label: 'میانگین امتیاز',
          data: agents.map(() => 55),
          backgroundColor: '#6366f1',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { labels: { color: '#e6e8ee' } } },
        scales: {
          x: { ticks: { color: '#8a92a6' }, grid: { color: '#3a3f4d' } },
          y: { min: 0, max: 100, ticks: { color: '#8a92a6' }, grid: { color: '#3a3f4d' } }
        }
      }
    });
    
    status.textContent = '✅ Charts rendered successfully!';
  } catch(e) {
    status.className = 'err';
    status.textContent = '❌ Error: ' + e.message;
  }
}
test();
</script>
</body>
</html>
