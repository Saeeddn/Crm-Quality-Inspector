<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Chart Test</title>
<style>
body { background: #1a1d27; color: #e6e8ee; font-family: Tahoma; padding: 20px; }
canvas { background: #2a2f3d; border-radius: 8px; margin: 10px 0; }
#status { margin: 10px 0; padding: 10px; border-radius: 4px; }
.ok { background: #22c55e20; color: #22c55e; }
.err { background: #ef444420; color: #ef4444; }
.info { background: #6366f120; color: #6366f1; }
</style>
</head>
<body>
<h2>Chart.js + jQuery Test</h2>
<div id="status" class="info">در حال تست...</div>
<canvas id="c1" width="400" height="200"></canvas>
<canvas id="c2" width="400" height="200"></canvas>
<canvas id="c3" width="400" height="200"></canvas>

<script src="/static/jquery.js"></script>
<script src="/static/chart.js"></script>
<script>
(function() {
  const status = document.getElementById('status');
  const results = [];
  
  // Test 1: jQuery
  if (typeof $ === 'function') {
    results.push('✅ jQuery OK');
  } else {
    results.push('❌ jQuery NOT loaded');
  }
  
  // Test 2: Chart.js
  if (typeof Chart !== 'undefined') {
    results.push('✅ Chart.js OK');
  } else {
    results.push('❌ Chart.js NOT loaded');
  }
  
  // Test 3: Can find canvas
  const c1 = document.getElementById('c1');
  if (c1) {
    results.push('✅ Canvas #c1 found');
  } else {
    results.push('❌ Canvas #c1 NOT found');
  }
  
  // Test 4: Can get 2D context
  if (c1) {
    const ctx = c1.getContext('2d');
    if (ctx) {
      results.push('✅ Canvas 2D context OK');
    } else {
      results.push('❌ Canvas 2D context NULL');
    }
  }
  
  // Test 5: Create simple chart
  try {
    const ctx = c1.getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['A', 'B', 'C'],
        datasets: [{
          label: 'Test',
          data: [10, 20, 30],
          borderColor: '#6366f1',
          backgroundColor: 'rgba(99,102,241,0.3)',
          fill: true
        }]
      },
      options: { responsive: false }
    });
    if (chart) {
      results.push('✅ Line chart created');
      chart.destroy();
    } else {
      results.push('❌ Line chart creation failed');
    }
  } catch(e) {
    results.push('❌ Line chart error: ' + e.message);
  }
  
  // Test 6: Doughnut chart
  try {
    const c2 = document.getElementById('c2');
    if (c2) {
      const ctx2 = c2.getContext('2d');
      new Chart(ctx2, {
        type: 'doughnut',
        data: {
          labels: ['Healthy', 'Improvement', 'Critical'],
          datasets: [{ data: [0, 5, 3], backgroundColor: ['#22c55e', '#f59e0b', '#ef4444'] }]
        }
      });
      results.push('✅ Doughnut chart created');
    }
  } catch(e) {
    results.push('❌ Doughnut chart error: ' + e.message);
  }
  
  // Test 7: Bar chart
  try {
    const c3 = document.getElementById('c3');
    if (c3) {
      const ctx3 = c3.getContext('2d');
      new Chart(ctx3, {
        type: 'bar',
        data: {
          labels: ['Agent1', 'Agent2', 'Agent3', 'Agent4'],
          datasets: [{ label: 'Score', data: [55, 60, 65, 50], backgroundColor: '#6366f1' }]
        }
      });
      results.push('✅ Bar chart created');
    }
  } catch(e) {
    results.push('❌ Bar chart error: ' + e.message);
  }
  
  // Test 8: Fetch dashboard API
  fetch('/api/auth/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: 'admin', password: 'ADMIN_PASS_REDACTED'})
  })
  .then(r => r.json())
  .then(d => {
    const token = d.data.token;
    return fetch('/api/reports/dashboard', {
      headers: {'Authorization': 'Bearer ' + token}
    });
  })
  .then(r => r.json())
  .then(d => {
    if (d.success) {
      results.push('✅ Dashboard API: ' + JSON.stringify(d.data));
    } else {
      results.push('❌ Dashboard API failed: ' + d.error);
    }
    status.className = 'ok';
    status.innerHTML = results.join('<br>');
  })
  .catch(e => {
    results.push('❌ API fetch error: ' + e.message);
    status.className = 'err';
    status.innerHTML = results.join('<br>');
  });
  
  status.innerHTML = results.join('<br>');
})();
</script>
</body>
</html>
