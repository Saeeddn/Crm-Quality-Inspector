<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تست overlay</title>
<style>
body { margin: 0; font-family: sans-serif; background: #1a1d2e; color: white; }
.mobile-menu-btn {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 100;
  background: #12141a;
  border: 1px solid #2a2f3d;
  border-radius: 6px;
  padding: 8px 12px;
  color: white;
  font-size: 14px;
  cursor: pointer;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  padding-right: 80px;
  border-bottom: 1px solid #2a2f3d;
  background: #12141a;
  position: sticky;
  top: 0;
  z-index: 10;
}
.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  margin-top: 70px;
}
h1 { color: #6366f1; }
</style>
</head>
<body>
<button class="mobile-menu-btn">☰ منو</button>
<div class="topbar">
  <div style="font-size: 16px; font-weight: bold;">پیشنهاد QA</div>
  <span>متصل</span>
</div>
<div class="main">
  <div style="padding: 20px;">
    <h1>محتوای اصلی</h1>
    <p>اگر منو روی متن افتاده باشد، باید اینجا باشد.</p>
  </div>
</div>
</body>
</html>
