<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>App.js Test</title>
<style>
body { background: #1a1d27; color: #e6e8ee; font-family: monospace; padding: 20px; }
#log { background: #000; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 12px; }
.ok { color: #22c55e; }
.err { color: #ef4444; }
.info { color: #6366f1; }
</style>
</head>
<body>
<div id="loginScreen"><form id="loginForm"><input id="loginUser"><input id="loginPass" type="password"></form></div>
<div id="appShell" class="hidden">
  <div id="userBadge"></div>
  <div id="topbarTitle"></div>
  <div id="kpiGrid"></div>
  <div id="coverageBar"></div>
  <div id="connStatus"></div>
  <span id="logoutBtn"></span>
  <nav><span class="nav-item" data-tab="dashboard"></span></nav>
  <div id="page-dashboard" class="page">
    <canvas id="trendChart" width="600" height="200"></canvas>
    <canvas id="scoreChart" width="300" height="200"></canvas>
    <canvas id="agentChart" width="300" height="200"></canvas>
  </div>
  <div id="page-interactions" class="page hidden">
    <table id="interactionsTable"><tbody></tbody></table>
    <div id="interactionsPager"></div>
    <input id="fSearch"><select id="fChannel"></select><select id="fAgent"></select><select id="fStatus"></select>
    <button id="exportCsvBtn"></button>
  </div>
  <div id="page-issues" class="page hidden"><table id="issuesTable"></table><select id="iStatus"></select><select id="iSeverity"></select></div>
  <div id="page-agents" class="page hidden"><table id="agentsTable"></table></div>
  <div id="page-customers" class="page hidden"><table id="customersTable"></table></div>
  <div id="page-kpis" class="page hidden"><button id="seedKpisBtn"></button><button id="newKpiBtn"></button></div>
  <div id="page-users" class="page hidden"><button id="newUserBtn"></button></div>
  <div id="page-report" class="page hidden"><select id="reportAgent"></select></div>
  <div id="modal" class="modal-overlay"><div class="modal"><div id="modalTitle"></div><div id="modalBody"></div><div id="modalFooter"></div><button data-action="close-modal"></button></div></div>
  <div id="toast"></div>
  <div id="loadingOverlay" class="loading-overlay" hidden><div id="loadingText"></div></div>
</div>

<div id="log"></div>

<script>
const log = document.getElementById('log');
function add(msg, cls) {
  const t = new Date().toISOString().slice(11, 23);
  log.innerHTML += `<span class="${cls || ''}">[${t}] ${msg}</span>\n`;
  log.scrollTop = log.scrollHeight;
}

window.addEventListener('error', e => {
  add('❌ ' + e.message + ' at ' + (e.filename||'').split('/').pop() + ':' + e.lineno, 'err');
  if (e.error && e.error.stack) add(e.error.stack, 'err');
});

(async function() {
  for (const lib of ['jquery', 'chart']) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '/static/' + lib + '.js';
      s.onload = res;
      s.onerror = () => { add('✗ ' + lib + ' FAIL', 'err'); rej(); };
      document.head.appendChild(s);
    });
  }
  add('libs loaded', 'ok');
  
  // load app.js
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = '/static/app.js?v=10';
    s.onload = res;
    s.onerror = () => { add('✗ app.js FAIL', 'err'); rej(); };
    document.head.appendChild(s);
  });
  add('app.js loaded', 'ok');
  
  add('typeof loadDashboard: ' + typeof loadDashboard, typeof loadDashboard === 'function' ? 'ok' : 'err');
  add('typeof renderDashboard: ' + typeof renderDashboard, typeof renderDashboard === 'function' ? 'ok' : 'err');
  add('typeof renderTrendChart: ' + typeof renderTrendChart, typeof renderTrendChart === 'function' ? 'ok' : 'err');
  add('typeof enterApp: ' + typeof enterApp, typeof enterApp === 'function' ? 'ok' : 'err');
  add('typeof $: ' + typeof $ + ' (vanilla=' + (typeof $ === 'function' && $.toString().length < 50 ? 'yes' : 'no') + ')', 'info');
  add('typeof Chart: ' + typeof Chart, typeof Chart === 'function' ? 'ok' : 'err');
  
  // login
  const lr = await fetch('/api/auth/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({username: 'admin', password: 'ADMIN_PASS_REDACTED'})
  });
  const lj = await lr.json();
  if (lj.success) {
    add('login OK', 'ok');
    setToken(lj.data.token, { username: lj.data.username, is_admin: lj.data.is_admin });
    add('token set, State.token: ' + (State.token ? 'YES' : 'NO'), State.token ? 'ok' : 'err');
    try {
      add('Calling enterApp()...', 'info');
      await enterApp();
      add('enterApp() returned', 'ok');
      setTimeout(() => {
        add('AFTER enterApp:', 'info');
        add('State.agents=' + State.agents.length, State.agents.length > 0 ? 'ok' : 'err');
        add('State.interactions=' + State.interactions.length, State.interactions.length > 0 ? 'ok' : 'err');
        add('State.scores=' + Object.keys(State.scores).length, Object.keys(State.scores).length > 0 ? 'ok' : 'err');
        add('State.trendChart=' + (State.trendChart ? 'YES' : 'NO'), State.trendChart ? 'ok' : 'err');
        add('State.scoreChart=' + (State.scoreChart ? 'YES' : 'NO'), State.scoreChart ? 'ok' : 'err');
        add('State.agentChart=' + (State.agentChart ? 'YES' : 'NO'), State.agentChart ? 'ok' : 'err');
        add('Canvas sizes:', 'info');
        document.querySelectorAll('canvas').forEach(c => {
          add('  ' + c.id + ': ' + c.width + 'x' + c.height, 'info');
        });
      }, 500);
    } catch(e) {
      add('enterApp() ERROR: ' + e.message, 'err');
      add(e.stack, 'err');
    }
  } else {
    add('login fail', 'err');
  }
})();
</script>
</body>
</html>
