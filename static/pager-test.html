<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Pager Test</title>
<style>
body { background: #1a1d27; color: #e6e8ee; font-family: monospace; padding: 20px; }
#log { background: #000; padding: 10px; border-radius: 4px; white-space: pre-wrap; font-size: 13px; }
.ok { color: #22c55e; }
.err { color: #ef4444; }
</style>
</head>
<body>
<h3>Pager Size Test</h3>
<div id="log"></div>
<div id="interactionsPager"></div>

<script>
const log = document.getElementById('log');
function add(msg, cls) {
  const t = new Date().toISOString().slice(11, 23);
  log.innerHTML += `<span class="${cls || ''}">[${t}] ${msg}</span>\n`;
  log.scrollTop = log.scrollHeight;
}
window.addEventListener('error', e => {
  add('❌ ' + e.message, 'err');
  if (e.error && e.error.stack) add(e.error.stack, 'err');
});

(async function() {
  try {
    // Load jQuery
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '/static/jquery.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    add('✓ jquery loaded', 'ok');
    // Load Chart
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '/static/chart.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    add('✓ chart loaded', 'ok');
    // Load app.js
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = '/static/app.js?v=' + Date.now();
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    add('✓ app.js loaded', 'ok');
    add('typeof renderPagination: ' + typeof renderPagination, typeof renderPagination === 'function' ? 'ok' : 'err');
    add('typeof State: ' + typeof State, typeof State !== 'undefined' ? 'ok' : 'err');
    
    // Test renderPagination directly
    if (typeof renderPagination === 'function') {
      const total = 12;
      const page = 1;
      const totalPages = 2;
      const fakeOnChange = (p) => add('onChange called with page=' + p, 'ok');
      renderPagination('#interactionsPager', total, page, totalPages, fakeOnChange);
      add('renderPagination called', 'ok');
      // Check DOM
      setTimeout(() => {
        const pager = document.getElementById('interactionsPager');
        const sel = pager.querySelector('.pager-size-select');
        if (sel) {
          add('✓ pager-size-select found in DOM', 'ok');
          add('Options: ' + Array.from(sel.options).map(o => o.value).join(', '), 'ok');
        } else {
          add('✗ pager-size-select NOT in DOM', 'err');
        }
        add('Pager HTML: ' + pager.innerHTML.substring(0, 300), 'err');
      }, 100);
    } else {
      add('✗ renderPagination not a function', 'err');
    }
  } catch (e) {
    add('FAIL: ' + e.message, 'err');
  }
})();
</script>
</body>
</html>
