name: CI

on:
  push:
    branches: [master, dev, v1.0]
  pull_request:
    branches: [master, dev, v1.0]

# Cancel in-progress runs for the same branch when a new push lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Build & unit tests ──────────────────────────────────────────
  # Fast feedback: catches compilation errors and pure-logic bugs without
  # needing a database. Runs on every push.
  build-and-unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build --verbose

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Run unit tests (no DB required)
        run: cargo test --test unit_test --verbose

      - name: Run lib tests
        run: cargo test --lib --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  # ── Docker build ────────────────────────────────────────────────
  # Validates that the multi-stage Dockerfile actually builds. This catches
  # Docker-layer-cache regressions early. Only runs on master/dev (not on
  # every PR — keeps PR checks fast).
  #
  # NOTE: integration tests used to live here as a separate job. They
  # were removed because the auth/Postgres setup was unreliable across
  # runner versions and blocking CI on it was slowing the team down.
  # Run integration tests locally before merging to master:
  #     cargo test --test integration_test -- --test-threads=1
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build-and-unit]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        run: docker build -t crm-qi:ci-test .

      - name: Verify image size is reasonable (multi-stage should be < 500MB)
        run: |
          SIZE=$(docker image inspect crm-qi:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "::error::Image is ${SIZE_MB}MB — multi-stage build regression?"
            exit 1
          fi

      - name: Smoke test the container (without DB)
        # Start the container with no DB; expect it to refuse to start
        # (this is the documented behavior — fail-fast on missing DATABASE_URL).
        run: |
          docker run --rm crm-qi:ci-test 2>&1 | tee /tmp/docker-out.log
          if ! grep -q "DATABASE_URL env var is required" /tmp/docker-out.log; then
            echo "::error::Container did NOT fail-fast on missing DATABASE_URL"
            exit 1
          fi
          echo "✓ Container correctly refuses to start without DATABASE_URL"