name: CI

on:
  push:
    branches: [master, dev, v1.0]
  pull_request:
    branches: [master, dev, v1.0]

# Cancel in-progress runs for the same branch when a new push lands
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Build & unit tests ──────────────────────────────────────────
  # Fast feedback: catches compilation errors and pure-logic bugs without
  # needing a database. Runs on every push.
  build-and-unit:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (debug)
        run: cargo build --verbose

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Run unit tests (no DB required)
        run: cargo test --test unit_test --verbose

      - name: Run lib tests
        run: cargo test --lib --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  # ── Integration tests ───────────────────────────────────────────
  # Requires a live Postgres + a running server. We don't use a service
  # container for Postgres because env-var propagation to the entrypoint
  # was unreliable. We start Postgres ourselves with `docker run`, then
  # build the server binary, start it in the background, wait for
  # /api/health, and run the suite. The server is killed in the
  # always() cleanup step.
  integration:
    name: Integration tests (Postgres + server)
    runs-on: ubuntu-latest
    env:
      # Use 127.0.0.1 (not localhost) so both psql and the Rust server
      # connect over TCP. psql on some runners resolves localhost to the
      # Unix socket, where pg_hba is 'trust' by default — so a passing
      # psql check on localhost did not actually exercise the same
      # auth path the server would use.
      DATABASE_URL: postgres://crm_test:***@127.0.0.1:5432/crm_test
      # These MUST match the credentials in tests/integration_test.rs —
      # the smoke tests hardcode "admin"/"NewSecretPass789" for login.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: NewSecretPass789
      RUST_LOG: warn
      SERVER_ADDR: 127.0.0.1:3000
      POSTGRES_USER: crm_test
      POSTGRES_PASSWORD: crm_test_pass
      POSTGRES_DB: crm_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpq (build dep for sqlx) + postgresql-client
        run: sudo apt-get update && sudo apt-get install -y libpq-dev postgresql-client

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-int-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-int-

      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER="$POSTGRES_USER" \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB="$POSTGRES_DB" \
            -p 5432:5432 \
            postgres:16-alpine
          echo "Postgres container started"

      - name: Wait for Postgres to be ready and verify auth over TCP
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" > /dev/null 2>&1; then
              if PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" > /dev/null 2>&1; then
                echo "Postgres TCP auth verified at attempt $i"
                exit 0
              else
                echo "psql over TCP failed at attempt $i:"
                PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT 1" 2>&1 | head -5 || true
              fi
            fi
            echo "Waiting for Postgres (attempt $i/30)..."
            sleep 1
          done
          echo "::error::Postgres did not become ready or auth failed"
          docker logs ci-postgres || true
          exit 1

      - name: Build release binary
        run: cargo build --release --verbose --bin crm-quality-inspector

      - name: Start server in background
        # Move .env aside because src/main.rs auto-loads it via dotenvy,
        # and a stale .env (with different DATABASE_URL/admin credentials)
        # would silently override the CI env vars.
        run: |
          set -m
          if [ -f .env ]; then
            echo "Moving .env aside so it doesn't override CI env vars"
            mv .env .env.ci-bak
          fi
          echo "--- effective server env ---"
          echo "DATABASE_URL=$DATABASE_URL"
          echo "ADMIN_USERNAME=$ADMIN_USERNAME"
          echo "SERVER_ADDR=$SERVER_ADDR"
          ./target/release/crm-quality-inspector > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          echo "Server started with PID $SERVER_PID"

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null 2>&1; then
              echo "Server ready at attempt $i"
              curl -s http://127.0.0.1:3000/api/health
              echo ""
              exit 0
            fi
            echo "Waiting for server ($i/30)..."
            sleep 1
          done
          echo "::error::Server failed to become ready in 30s"
          echo "--- last 100 lines of server.log ---"
          tail -n 100 /tmp/server.log
          exit 1

      - name: Run integration tests
        run: cargo test --test integration_test --verbose -- --test-threads=1

      - name: Stop server (always)
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "Stopping server PID $SERVER_PID"
            kill -TERM -- -"$SERVER_PID" 2>/dev/null || kill -TERM "$SERVER_PID" 2>/dev/null || true
            sleep 1
            kill -KILL -- -"$SERVER_PID" 2>/dev/null || kill -KILL "$SERVER_PID" 2>/dev/null || true
          else
            echo "Server already stopped"
          fi
          echo "--- server.log tail (last 50 lines) ---"
          tail -n 50 /tmp/server.log || true

      - name: Stop Postgres (always)
        if: always()
        run: docker rm -f ci-postgres 2>/dev/null || true

  # ── Docker build ────────────────────────────────────────────────
  # Validates that the multi-stage Dockerfile actually builds. This catches
  # Docker-layer-cache regressions early. Only runs on master/dev (not on
  # every PR — keeps PR checks fast).
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build-and-unit, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        run: docker build -t crm-qi:ci-test .

      - name: Verify image size is reasonable (multi-stage should be < 500MB)
        run: |
          SIZE=$(docker image inspect crm-qi:ci-test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -gt 500 ]; then
            echo "::error::Image is ${SIZE_MB}MB — multi-stage build regression?"
            exit 1
          fi

      - name: Smoke test the container (without DB)
        # Start the container with no DB; expect it to refuse to start
        # (this is the documented behavior — fail-fast on missing DATABASE_URL).
        run: |
          docker run --rm crm-qi:ci-test 2>&1 | tee /tmp/docker-out.log
          if ! grep -q "DATABASE_URL env var is required" /tmp/docker-out.log; then
            echo "::error::Container did NOT fail-fast on missing DATABASE_URL"
            exit 1
          fi
          echo "✓ Container correctly refuses to start without DATABASE_URL"