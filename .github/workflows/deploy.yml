name: Deploy to Ollama Server

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

env:
  SERVER_HOST: 138.201.144.251
  SERVER_USER: root
  PROJECT_DIR: /root/crm-quality-inspector
  DATABASE_URL: "postgres://crm_quality:knVnXLtwmtKEG3wgG60HnsI@127.0.0.1:5432/crm_quality_inspector"
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: knVnXLtwmtKEG3wgG60HnsI
  SERVER_PORT: "3000"
  LOG_FILE: /var/log/crm-qi/crm-quality-inspector.log

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to server
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='target' \
            --exclude='*.log' \
            --exclude='.hermes' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.PROJECT_DIR }}/

      - name: Create .env on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "echo 'DATABASE_URL=${{ env.DATABASE_URL }}' > ${{ env.PROJECT_DIR }}/.env && echo 'ADMIN_USERNAME=${{ env.ADMIN_USERNAME }}' >> ${{ env.PROJECT_DIR }}/.env && echo 'ADMIN_PASSWORD=${{ env.ADMIN_PASSWORD }}' >> ${{ env.PROJECT_DIR }}/.env && echo 'SERVER_HOST=0.0.0.0' >> ${{ env.PROJECT_DIR }}/.env && echo 'SERVER_PORT=${{ env.SERVER_PORT }}' >> ${{ env.PROJECT_DIR }}/.env && echo 'LOG_FILE=${{ env.LOG_FILE }}' >> ${{ env.PROJECT_DIR }}/.env"

      - name: Build and start on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd ${{ env.PROJECT_DIR }} && mkdir -p /root/crm-qi-logs && chown 999:999 /root/crm-qi-logs && docker compose down --remove-orphans 2>/dev/null || true && docker compose up -d --build"
        env:
          DOCKER_BUILDKIT: 1

      - name: Verify deployment
        run: |
          sleep 5
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "docker ps --filter 'name=crm-quality-inspector' && curl -s http://127.0.0.1:3000/api/health"
