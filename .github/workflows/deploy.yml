name: Deploy to Ollama Server

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

env:
  SERVER_HOST: 138.201.144.251
  SERVER_USER: root
  PROJECT_DIR: /root/crm-quality-inspector
  DB_PASSWORD: crm_inspector_2024

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to server
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='target' \
            --exclude='*.log' \
            --exclude='.hermes' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/id_ed25519" \
            . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.PROJECT_DIR }}/

      - name: Create env on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            PASSWORD="${DB_PASSWORD}"
            echo "DATABASE_URL=postgres://crm_quality:${PASSWORD}@127.0.0.1:5432/crm_quality_inspector" > "${PROJECT_DIR}/.env"
            echo "ADMIN_USERNAME=admin" >> "${PROJECT_DIR}/.env"
            echo "ADMIN_PASSWORD=${PASSWORD}" >> "${PROJECT_DIR}/.env"
            echo "SERVER_HOST=0.0.0.0" >> "${PROJECT_DIR}/.env"
            echo "SERVER_PORT=3000" >> "${PROJECT_DIR}/.env"
            echo "LOG_FILE=/var/log/crm-qi/crm-quality-inspector.log" >> "${PROJECT_DIR}/.env"
            echo "Created .env on server"
          ENDSSH

      - name: Build and start on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd ${{ env.PROJECT_DIR }} && mkdir -p /root/crm-qi-logs && chown 999:999 /root/crm-qi-logs && docker compose down --remove-orphans 2>/dev/null || true && docker compose up -d --build"

      - name: Verify deployment
        run: |
          sleep 10
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "docker ps --filter 'name=crm-quality-inspector' && curl -s http://127.0.0.1:3000/api/health"
