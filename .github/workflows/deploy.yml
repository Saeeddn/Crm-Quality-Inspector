name: Deploy to Ollama Server

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

env:
  SERVER_HOST: 138.201.144.251
  SERVER_USER: root
  PROJECT_DIR: /root/crm-quality-inspector

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build Docker image on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            set -e
            cd $PROJECT_DIR
            
            # Pull latest code
            git config --global --add safe.directory $PROJECT_DIR
            git pull origin master
            
            # Ensure log directory exists
            mkdir -p /root/crm-qi-logs
            chown 999:999 /root/crm-qi-logs
            
            # Create .env if not exists
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Stop old container and rebuild
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build
            
            echo ""
            echo "=== Deployment Status ==="
            docker ps --filter "name=crm-quality-inspector"
            echo ""
            echo "App URL: http://${{ env.SERVER_HOST }}:3000"
            echo "Health: curl http://${{ env.SERVER_HOST }}:3000/api/health"
            echo "Logs: tail -f /root/crm-qi-logs/crm-quality-inspector.log"
          EOF
