name: Deploy to Ollama Server

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

env:
  SERVER_HOST: 138.201.144.251
  SERVER_USER: root
  PROJECT_DIR: /root/crm-quality-inspector

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t crm-quality-inspector:deploy .
          docker save crm-quality-inspector:deploy | gzip > /tmp/crm-qi-image.tar.gz
          echo "Image saved: $(ls -lh /tmp/crm-qi-image.tar.gz)"

      - name: Copy image to server
        run: |
          scp -i "${{ secrets.DEPLOY_SSH_KEY }}" \
            -o StrictHostKeyChecking=no \
            /tmp/crm-qi-image.tar.gz \
            ${SERVER_USER}@${SERVER_HOST}:/tmp/

      - name: Deploy on server
        run: |
          ssh -i "${{ secrets.DEPLOY_SSH_KEY }}" \
            -o StrictHostKeyChecking=no \
            ${SERVER_USER}@${SERVER_HOST} << 'EOF'
            set -e
            cd $PROJECT_DIR

            # Load the image
            docker load < /tmp/crm-qi-image.tar.gz
            rm /tmp/crm-qi-image.tar.gz

            # Ensure log directory exists with correct permissions
            mkdir -p /root/crm-qi-logs
            chown 999:999 /root/crm-qi-logs

            # Stop old container and start fresh (bind mount handles logs)
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d

            # Show status
            docker ps --filter "name=crm-quality-inspector"
            echo "Deployment complete!"
          EOF
