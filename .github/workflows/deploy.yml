name: Deploy to Ollama Server

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

env:
  SERVER_HOST: 138.201.144.251
  SERVER_USER: root
  PROJECT_DIR: /root/crm-quality-inspector

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to server
        run: |
          rsync -avz \
            --exclude='.git' \
            --exclude='target' \
            --exclude='*.log' \
            --exclude='.hermes' \
            --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.PROJECT_DIR }}/

      - name: Build and start on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            set -e
            cd $PROJECT_DIR
            
            # Ensure log directory exists with correct permissions
            mkdir -p /root/crm-qi-logs
            chown 999:999 /root/crm-qi-logs
            
            # Create .env if not exists (preserve existing credentials)
            if [ ! -f .env ]; then
              cp .env.example .env
            fi
            
            # Stop old container and rebuild
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build
            
            echo ""
            echo "=== Deployment Complete ==="
            docker ps --filter "name=crm-quality-inspector"
            echo ""
            echo "App: http://${{ env.SERVER_HOST }}:3000"
            echo "Health: curl http://${{ env.SERVER_HOST }}:3000/api/health"
          EOF
