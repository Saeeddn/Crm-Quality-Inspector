name: Deploy to Ollama Server

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

env:
  SERVER_HOST: 138.201.144.251
  SERVER_USER: root
  PROJECT_DIR: /root/crm-quality-inspector

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export image
        run: |
          docker build -t crm-quality-inspector:deploy .
          docker save crm-quality-inspector:deploy | gzip > /tmp/crm-qi-image.tar.gz
          echo "Image saved: $(ls -lh /tmp/crm-qi-image.tar.gz)"

      - name: Copy image to server
        run: |
          scp /tmp/crm-qi-image.tar.gz ${SERVER_USER}@${SERVER_HOST}:/tmp/
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy on server
        run: |
          ssh ${SERVER_USER}@${SERVER_HOST} << 'EOF'
            set -e
            cd $PROJECT_DIR

            # Load the image
            docker load < /tmp/crm-qi-image.tar.gz
            rm /tmp/crm-qi-image.tar.gz

            # Ensure .env exists
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Recreate log volume directory if needed
            docker volume create crm_qi_logs 2>/dev/null || true

            # Stop old containers, start fresh
            docker compose down --remove-orphans 2>/dev/null || true
            docker compose up -d --build

            # Show status
            docker compose ps
            echo "Deployment complete!"
          EOF
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
