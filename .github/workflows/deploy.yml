name: Deploy to Ollama Server

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

env:
  SERVER_HOST: 138.201.144.251
  SERVER_USER: root
  PROJECT_DIR: /root/crm-quality-inspector
  DB_PASSWORD: crm_inspector_2024

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync files to server
        run: |
          rsync -avz \
            --exclude=".git" \
            --exclude="target" \
            --exclude="*.log" \
            --exclude=".hermes" \
            --exclude=".env" \
            -e "ssh -i ~/.ssh/id_ed25519" \
            . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.PROJECT_DIR }}/

      - name: Create env on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} bash -c '
            echo "DATABASE_URL=postgres://crm_quality:${{ env.DB_PASSWORD }}@127.0.0.1:5432/crm_quality_inspector" > /root/crm-quality-inspector/.env
            echo "ADMIN_USERNAME=admin" >> /root/crm-quality-inspector/.env
            echo "ADMIN_PASSWORD=${{ env.DB_PASSWORD }}" >> /root/crm-quality-inspector/.env
            echo "SERVER_HOST=0.0.0.0" >> /root/crm-quality-inspector/.env
            echo "SERVER_PORT=3000" >> /root/crm-quality-inspector/.env
            echo "LOG_FILE=/var/log/crm-qi/crm-quality-inspector.log" >> /root/crm-quality-inspector/.env
          '

      - name: Build and start on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd $PROJECT_DIR && docker compose down 2>/dev/null || true && docker compose build && docker compose up -d"

      - name: Verify deployment
        run: |
          sleep 10
          ssh -i ~/.ssh/id_ed25519 ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "docker ps --filter 'name=crm-quality-inspector' && curl -s http://127.0.0.1:3000/api/health"
